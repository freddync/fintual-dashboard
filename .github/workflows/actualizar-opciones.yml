name: Actualizar opciones

# Put/call de cada empresa para la tabla general (data/put_call.csv).
# El Open Interest cambia una vez al día: la OCC lo publica de noche y Cboe lo muestra
# en la mañana. Lun-vie a las 8:40 NY y, de respaldo (GitHub atrasa o se salta
# tareas programadas), a las 11:40 NY. Horas en UTC con horario de verano de NY;
# en invierno corren una hora antes, igual después de la publicación del OI.
on:
  schedule:
    - cron: "40 12 * * 1-5"
    - cron: "40 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opciones
  cancel-in-progress: true

jobs:
  opciones:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar put/call
        run: |
          pip install requests pandas numpy
          python actualizar.py opciones

      - name: Publicar
        run: |
          if git diff --quiet -- data/put_call.csv && git ls-files --error-unmatch data/put_call.csv >/dev/null 2>&1; then
            echo "El put/call no cambió: no se publica nada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/put_call.csv data/_ultima_actualizacion.json
          git commit -m "Put/call $(TZ=America/New_York date '+%Y-%m-%d %H:%M NY')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep 15; done
          exit 1
