name: Actualizar fundamentales

# Una vez al mes (día 1, 06:00 UTC) y a mano desde la pestaña Actions.
# Los estados financieros cambian cada trimestre, así que no hace falta más.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  fundamentales:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar fundamentales
        run: |
          pip install requests pandas
          python actualizar.py fundamentales

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentales data/_ultima_actualizacion.json
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Fundamentales $(date '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 15; done
          exit 1
