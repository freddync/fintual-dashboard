name: Actualizar precios

# Cada hora, todos los días, al minuto 17.
#
# GitHub atrasa las tareas programadas (se han visto atrasos de 6 horas) y a veces
# se salta algunas, sobre todo las de la hora en punto. Por eso:
#   - se pide cada hora, para que siempre lleguen varias al día aunque se pierdan;
#   - no hay filtro de horario: una corrida atrasada igual actualiza;
#   - si los precios no cambiaron (noche, fin de semana, feriado) no se hace commit.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: true    # si se juntan dos, manda la más reciente

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar precios
        run: |
          pip install requests pandas
          python actualizar.py precios

      - name: Publicar
        run: |
          if git diff --quiet -- data/precios; then
            echo "Los precios no cambiaron: no se publica nada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precios data/_ultima_actualizacion.json
          git commit -m "Precios $(TZ=America/New_York date '+%Y-%m-%d %H:%M NY')"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 15; done
          exit 1
